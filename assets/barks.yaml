# Ambient NPC dialogue.
#
# Lines are grouped by ROLE. At spawn time the game picks a couple at random and
# fills the {placeholders} from live game data, so a "customer" wishing aloud is
# quoting a real trade route on a real planet — the player overhears genuine
# information instead of being handed a tip.
#
# Placeholders (a line is SKIPPED if its data isn't available here):
#   {here}      this planet's display name
#   {commodity} a commodity actually traded on this planet
#   {dest}      the planet in this system that pays best for {commodity}
#   {ship}      a hull this planet's shipyard sells
#   {item}      an item this planet's outfitter sells
#   {faction}   the faction currently HOLDING this system (live, not the YAML)
#   {enemy}     a faction at war with the holder
#   {front}     a system with a live front right now
#   {front_sponsor} / {front_enemy}   who is pushing, and against whom
#   {intensity} how hard that front is being fought
#   {regard}    what the holding faction makes of you ("wanted", "well regarded")
#
# NOTE: the war model tracks the PRESENT only — influence, holders and fronts
# are live, but nothing records WHEN anything changed. So lines may say "the
# front is here" or "they hold this system", never "they took it last month".
#
# Keep lines short — they show in a small chat box, and young players read them
# aloud. Two lines per NPC is the sweet spot: a greeting, then the substance.

roles:
  # ── Customers: informative banter. They aren't advising you, they're
  # thinking out loud — which is why it teaches without feeling like a tutorial.
  customer_shipyard:
    - "I keep eyeing that {ship}. With a hold that big I could run {commodity} out to {dest} and never look back."
    - "Been saving two years for a {ship}. Two years!"
    - "My old freighter's held together with tape and hope. Don't ask."
    - "If I had the cargo space, {commodity} to {dest} would pay for the ship in a season."
    - "They say a bigger hull just means bigger repair bills. They're not wrong."

  customer_outfitter:
    - "Thinking about a {item}. Space out past the lanes isn't as quiet as it used to be."
    - "Everyone tells me to buy more guns. Nobody tells me where to put them."
    - "I fitted a {item} last month. Wish I'd done it a year ago."
    - "Cheaper to outrun trouble than outshoot it, that's my rule."

  customer_mechanic:
    - "Took a beating coming in. Rock the size of a house, right off the bow."
    - "They quoted me a fortune. Worth it — a cracked hull won't fix itself."
    - "Third time here this month. I'm starting to think I'm the problem."
    - "Get your shields looked at before the run, not after. Learned that the hard way."

  customer_fuel:
    - "Filled up here, then ran dry two jumps out. Never again."
    - "Fuel's the one thing you can't talk your way out of needing."
    - "I always top off at {here}. Cheaper than being towed."
    - "Saw a ship drifting out there last week. Out of fuel, out of luck."

  customer_market:
    - "{commodity} is going cheap here. I hear {dest} pays proper money for it."
    - "Everything on {here} costs double what it should. Except {commodity}, oddly."
    - "Buy low, sell high. Easy to say on an empty stomach."
    - "If you've got hold space, {commodity} out to {dest} is the run I'd make."

  customer_bar:
    - "One more and I'm walking home. It's four systems, but I'll manage."
    - "Best thing on {here} is this bar. That's not a compliment to {here}."
    - "Everyone in here's got a story. Half of them are even true."

  customer_garrison:
    - "Signed up for the glory. Got paperwork instead."
    - "{faction} pays on time, I'll give them that."
    - "Quiet posting, this one. I'd like to keep it that way."

  # ── Shoppers milling between stalls: the trade-route informants.
  shopper:
    - "{commodity}'s a bargain on {here} right now."
    - "A hauler told me {dest} is desperate for {commodity}. Take that how you like."
    - "Prices here move fast. Blink and you've missed the good run."
    - "I only buy what I can carry. Learned that lesson twice."

  # ── Bar regulars: pointers. They route you to content, not to prices.
  regular:
    - "If you're after work, ask around in here. Someone always needs something moved."
    - "There's a fella been asking after a pilot. Might still be about."
    - "Word is the garrison's posting bounties again."
    - "The mechanic hears more than the bartender. Don't tell him I said so."

  # ── Generic filler, safe anywhere.
  generic:
    - "Mind how you go."
    - "Quiet day. I like it that way."
    - "New face. We don't get many."
    - "Safe travels, pilot."

  # ── Politics & war. All of this is read from live influence, so it stays
  # true as the war moves — and it moves on its own, not just when you act.
  intel_officer:
    - "Current picture: {faction} holds this system. {front_sponsor} is pushing on {front}."
    - "{front} is the one to watch. {intensity}, and it isn't settling."
    - "{faction} and {enemy} have been at each other's throats for years. Nothing new."
    - "Officially the border is quiet. Officially."
    - "You're {regard} around here, for whatever that's worth to you."

  partisan:
    - "{faction} calls this their system. Ask the people who live here what they call it."
    - "Loyalty follows whoever's holding the guns that week."
    - "{enemy} isn't finished. They never are."
    - "Everyone picks a side eventually. Some of us just pick later."

  veteran:
    - "I flew the {front} line. {intensity} is a tidy way to put it."
    - "Wars aren't won at the front. They're won at the fuel depot."
    - "{faction} pays, {enemy} pays. Money spends the same either way."
    - "Every side tells you they're the reasonable one."

  war_correspondent:
    - "The story right now is {front}. {front_sponsor} against {front_enemy}."
    - "Nobody reports the quiet systems. That's where it starts, though."
    - "{intensity} out there, and half of it never makes the reports."

  # ── Advice. The tipsy pilot means well and garbles it; the old hand is
  # oblique but never wrong. Both give REAL mechanical advice — the fun is
  # in working out what they actually mean.
  tipsy_pilot:
    - "Listen — listen. The trick is... you hold the A key. Auto-aim. Best thing they ever built."
    - "Fuel! Always the fuel. Scoop the... the shiny asteroids. The ones that look wet."
    - "Press Q. Targets the nearest rock. Or was it the nearest... something. Q, anyway."
    - "Don't fight the big ones head on. Go round. Round is good."
    - "I once flew four systems on fumes. Do NOT do that. But I did it."

  old_pilot:
    - "A full hold and an empty tank is the same as no hold at all."
    - "Everything in this bar will tell you to buy a gun. Buy the cargo space."
    - "The map knows more than the map tells you. Look at who owns what before you fly."
    - "Cheap on one world, dear on the next. That gap is the whole job."
    - "Take the small work first. Nobody hands a stranger the good contracts."
    - "If a system is being fought over, its markets go strange. Strange can pay."
    - "Repair before the run. It always costs less than repair after it."
